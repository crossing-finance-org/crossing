[package]
name = "crossing-auction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
soroban-sdk.workspace = true
crossing-common.workspace = true
[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = "=2.2.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
crossing-auction-factory = { path = "../auction-factory" }
crossing-price-registry = { path = "../price-registry" }
crossing-oracle-adapter = { path = "../oracle-adapter" }
