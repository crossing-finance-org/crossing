name: Contracts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install the repository Rust toolchain
        run: |
          rustup show
          rustup component add rustfmt clippy
          rustup target add wasm32v1-none
      - name: Verify contracts, reference vectors, and documentation
        run: ./scripts/check.sh
      - name: Execute the public demonstration
        run: ./scripts/demo.sh
      - name: Install source coverage tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Require 95 percent coverage in every production contract source
        run: ./scripts/coverage.sh
      - name: Preserve coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-coverage
          path: target/coverage/
          if-no-files-found: warn
          retention-days: 14
      - name: Package verified contract artifacts and build identity
        run: python3 scripts/wasm_artifacts.py package
      - name: Preserve tested contract artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tested-contracts-${{ github.sha }}
          path: target/verified-contracts/
          if-no-files-found: error
          retention-days: 14
